[package]
name = "forge"
version = "0.1.0"
description = "A local-first AI software engineering environment"
authors = ["Forge Contributors"]
edition = "2021"
default-run = "forge"

[lib]
name = "forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
walkdir = "2"
ignore = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.14"
base64 = "0.22"
lru = "0.18.1"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
once_cell = "1.21.4"
sha2 = "0.10"
notify = "6.1"
zip = { version = "8.6.0", default-features = true }

[target.'cfg(windows)'.dependencies]
# DPAPI (CryptProtectData) for API keys at rest; already in the lockfile via tokio/tauri.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

